<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Card</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <style>
    body { background: var(--bg); }
    .tools { max-width: 420px; margin: 16px auto 0; padding: 0 16px; display: flex; gap: 8px; align-items: center; }
    .tools button, .tools a { width: auto; margin: 0; }
    .card-qr { max-width: 340px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 32px 24px; text-align: center; color: #111; }
    .card-qr h1 { font-size: 1.25rem; font-weight: 600; margin: 0; color: #111; }
    .card-qr .tag { color: var(--muted); font-size: .9rem; margin: 4px 0 20px; }
    .card-qr .qr { margin: 0 auto; }
    .card-qr .steps-text { color: var(--muted); margin: 18px 0 0; }
    .card-qr .phone { font-weight: 600; margin-top: 14px; }
    .card-qr .url { margin-top: 4px; word-break: break-all; }
    /* Yin-yang in the middle of the QR code, on a small white circle. */
    .qr-slot { position: relative; }
    .qr-center { position: absolute; left: 50%; top: 50%; width: 24%; height: 24%; transform: translate(-50%, -50%);
                 background: #fff; border-radius: 50%; padding: 3%; box-sizing: border-box; }
    .qr-center svg { width: 100%; height: 100%; display: block; }
    @media print {
      body { background: #fff; }
      .tools { display: none; }
      .card-qr { margin: 0 auto; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="tools">
    <a class="back" href="/admin">← Dashboard</a>
    <button type="button" id="print" style="margin-left:auto">🖨 Print / Save as PDF</button>
  </div>
  <div class="card-qr">
    <h1 data-clinic>Suhail&#39;s Meridian Healing</h1>
    <p class="tag">Drugless wellness service</p>
    <div class="qr qr-slot" role="img" aria-label="QR code"></div>
    <p class="steps-text">Scan to send your photo</p>
    <div class="phone">+91 86067 57805</div>
    <div class="url url-slot"></div>
  </div>
  <script src="/common.js"></script>
  <script>
    const YY = `<circle cx="32" cy="32" r="21" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <path d="M32 11 A21 21 0 0 1 32 53 A10.5 10.5 0 0 1 32 32 A10.5 10.5 0 0 0 32 11 Z" fill="#111"/>
      <circle cx="32" cy="21.5" r="3.4" fill="#111"/><circle cx="32" cy="42.5" r="3.4" fill="#fff"/>`;
    api('/api/admin/qr').then((r) => {
      const centre = `<div class="qr-center"><svg viewBox="10 10 44 44" aria-hidden="true">${YY}</svg></div>`;
      document.querySelector('.qr-slot').innerHTML = r.svg + centre; // SVG made by our own server
      document.querySelector('.url-slot').textContent = r.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    }).catch((e) => alert(e.message));
    document.getElementById('print').addEventListener('click', () => window.print());
  </script>
</body>
</html>
