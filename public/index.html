<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Patient Check-in</title>
</head>
<body>
  <main class="wrap">
    <header class="brand"><div class="logo">✚</div><span data-clinic>Clinic</span></header>
    <div class="steps"><span class="on"></span><span></span><span></span></div>
    <form class="card" id="phoneForm" novalidate>
      <h1>Welcome</h1>
      <p class="sub">Enter the mobile number your family is registered with.</p>
      <label for="phone">Mobile number</label>
      <div class="phone-row">
        <input class="cc" value="+91" disabled aria-label="Country code">
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210" required autofocus>
      </div>
      <div class="error" id="error" role="alert"></div>
      <button type="submit" id="go">Continue</button>
    </form>
  </main>
  <script src="/common.js"></script>
  <script>
    const form = document.getElementById('phoneForm');
    const input = document.getElementById('phone');
    input.value = sessionStorage.getItem('phone') || '';
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('go');
      const error = document.getElementById('error');
      error.textContent = '';
      btn.disabled = true;
      try {
        const { phone } = await api('/api/patients?phone=' + encodeURIComponent(input.value));
        sessionStorage.setItem('phone', phone);
        location.href = '/patients?phone=' + phone;
      } catch (err) {
        error.textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
