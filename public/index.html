<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/styles.css">
  <title>Patient Check-in</title>
</head>
<body>
  <main class="wrap">
    <header class="brand"><div class="logo">✚</div><span data-clinic>Clinic</span></header>
    <div class="steps"><span class="on"></span><span></span><span></span><span></span></div>

    <form class="card" id="phoneForm" novalidate>
      <h1>Welcome</h1>
      <p class="sub">Enter the mobile number your family is registered with.</p>
      <label for="phone">Mobile number</label>
      <div class="phone-row">
        <input class="cc" value="+91" disabled aria-label="Country code">
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210" required autofocus>
      </div>
      <div class="error" id="phoneError" role="alert"></div>
      <button type="submit" id="sendBtn">Continue</button>
    </form>

    <form class="card hidden" id="otpForm" novalidate>
      <h1>Enter verification code</h1>
      <p class="sub">We sent a 6-digit code by SMS to <strong id="sentTo"></strong>.</p>
      <label for="code">Verification code</label>
      <input id="code" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" placeholder="••••••" required>
      <div class="error" id="otpError" role="alert"></div>
      <button type="submit" id="verifyBtn">Verify &amp; continue</button>
      <div class="row-between">
        <button type="button" class="link" id="changeNumber">Change number</button>
        <span><button type="button" class="link" id="resend" disabled>Resend code</button> <span id="timer"></span></span>
      </div>
    </form>
  </main>
  <script src="/common.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let phone = null;
    let countdown;

    $('phone').value = sessionStorage.getItem('phone') || '';

    // Already verified in this browser? Skip straight to the patient list.
    fetch('/api/session').then((r) => r.ok && (location.href = '/patients'));

    function startResendTimer(seconds) {
      clearInterval(countdown);
      $('resend').disabled = true;
      let left = seconds;
      const tick = () => {
        $('timer').textContent = left > 0 ? `in ${left}s` : '';
        if (left-- <= 0) { clearInterval(countdown); $('resend').disabled = false; }
      };
      tick();
      countdown = setInterval(tick, 1000);
    }

    async function sendCode(errorEl) {
      const res = await api('/api/otp/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone || $('phone').value }),
      });
      phone = res.phone;
      sessionStorage.setItem('phone', phone);
      if (res.verified) return (location.href = '/patients'); // OTP switched off on the server
      $('sentTo').textContent = fmtPhone(phone);
      $('phoneForm').classList.add('hidden');
      $('otpForm').classList.remove('hidden');
      $('code').value = '';
      $('code').focus();
      startResendTimer(res.resendAfter || 30);
      errorEl.textContent = '';
    }

    $('phoneForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('phoneError').textContent = '';
      $('sendBtn').disabled = true;
      phone = null;
      try {
        await sendCode($('phoneError'));
      } catch (err) {
        $('phoneError').textContent = err.message;
        // A code was sent moments ago: let them type it in.
        if (err.retryAfter) {
          phone = $('phone').value.replace(/\D/g, '').slice(-10);
          $('sentTo').textContent = fmtPhone(phone);
          $('phoneForm').classList.add('hidden');
          $('otpForm').classList.remove('hidden');
          $('otpError').textContent = 'A code was already sent. Enter it below.';
          startResendTimer(err.retryAfter);
        }
      } finally {
        $('sendBtn').disabled = false;
      }
    });

    $('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('otpError').textContent = '';
      const code = $('code').value.replace(/\D/g, '');
      if (code.length !== 6) return ($('otpError').textContent = 'Enter the 6-digit code.');
      $('verifyBtn').disabled = true;
      try {
        await api('/api/otp/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, code }),
        });
        location.href = '/patients';
      } catch (err) {
        $('otpError').textContent = err.message;
        $('verifyBtn').disabled = false;
        $('code').select();
      }
    });

    // Submit automatically once all 6 digits are typed or auto-filled from the SMS.
    $('code').addEventListener('input', () => {
      if ($('code').value.replace(/\D/g, '').length === 6) $('otpForm').requestSubmit();
    });

    $('resend').addEventListener('click', async () => {
      $('otpError').textContent = '';
      $('resend').disabled = true;
      try {
        await sendCode($('otpError'));
        $('otpError').textContent = '';
      } catch (err) {
        $('otpError').textContent = err.message;
        startResendTimer(err.retryAfter || 30);
      }
    });

    $('changeNumber').addEventListener('click', () => {
      clearInterval(countdown);
      $('otpForm').classList.add('hidden');
      $('phoneForm').classList.remove('hidden');
      $('phone').focus();
    });

    // Android Chrome: read the code straight from the SMS when supported.
    if ('OTPCredential' in window) {
      navigator.credentials.get({ otp: { transport: ['sms'] } })
        .then((c) => { if (c) { $('code').value = c.code; $('otpForm').requestSubmit(); } })
        .catch(() => {});
    }
  </script>
</body>
</html>
